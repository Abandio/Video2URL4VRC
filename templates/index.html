<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRCHAT Video Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-danger {
            background: rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
        }

        .btn-success {
            background: linear-gradient(90deg, #4caf50, #45a049);
            color: #fff;
        }

        .btn-warning {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .sidebar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .folders-panel {
            width: 250px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
        }

        .folders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .folders-title {
            font-size: 1rem;
            color: #a0a0a0;
        }

        .folder-list {
            list-style: none;
        }

        .folder-item {
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .folder-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .folder-item.active {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
        }

        .folder-item.all {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding-bottom: 15px;
        }

        .folder-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .main-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
        }

        .upload-section {
            border: 2px dashed rgba(102, 126, 234, 0.5);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .upload-section.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
        }

        .upload-section.analyzing {
            pointer-events: none;
            opacity: 0.7;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-wrapper {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
        }

        .video-card.processing {
            border: 2px solid rgba(255, 152, 0, 0.5);
        }

        .video-preview {
            background: rgba(0, 0, 0, 0.3);
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-info {
            padding: 15px;
        }

        .video-name {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-meta {
            display: flex;
            gap: 15px;
            color: #a0a0a0;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .video-actions {
            display: flex;
            gap: 10px;
        }

        .video-url-container {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .video-url {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #667eea;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            padding: 15px 25px;
            border-radius: 10px;
            color: #fff;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(90deg, #4caf50, #45a049);
        }

        .toast.error {
            background: linear-gradient(90deg, #f44336, #d32f2f);
        }

        .toast.warning {
            background: linear-gradient(90deg, #ff9800, #f57c00);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.2rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .badge {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
        }

        .badge-folder {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        .badge-processing {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
        }

        .format-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .format-info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .format-info-row:last-child {
            border-bottom: none;
        }

        .format-info-label {
            color: #a0a0a0;
        }

        .format-info-value {
            font-weight: 500;
        }

        .format-info-value.warning {
            color: #ff9800;
        }

        .format-info-value.success {
            color: #4caf50;
        }

        .transcode-options {
            margin-top: 15px;
        }

        .transcode-option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .transcode-option:hover {
            border-color: #667eea;
        }

        .transcode-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .transcode-option-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .transcode-option-title {
            font-weight: 500;
        }

        .transcode-option-desc {
            font-size: 0.8rem;
            color: #a0a0a0;
        }

        @media (max-width: 768px) {
            .sidebar {
                flex-direction: column;
            }

            .folders-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>VRCHAT Video Manager</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="scanFolder()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                    </svg>
                    扫描
                </button>
            </div>
        </header>

        <div class="sidebar">
            <div class="folders-panel">
                <div class="folders-header">
                    <span class="folders-title">文件夹</span>
                    <button class="btn btn-sm btn-secondary" onclick="showCreateFolderModal()">+ 新建</button>
                </div>
                <ul class="folder-list" id="folderList">
                    <li class="folder-item all active" onclick="filterByFolder('')">
                        <span>全部视频</span>
                        <span class="folder-count" id="totalCount">0</span>
                    </li>
                </ul>
            </div>

            <div class="main-content">
                <div class="upload-section" id="uploadSection">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5">
                        <path d="M12 16V4m0 0l4 4m-4-4l-4 4M5 19a2 2 0 01-2-2V7a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 11.707V17a2 2 0 01-2 2H5z"/>
                    </svg>
                    <p style="margin-top: 15px;">拖拽视频文件到此处，或点击选择文件</p>
                    <p style="color: #a0a0a0; font-size: 0.85rem; margin-top: 5px;">支持 MP4, MKV, MOV, AVI, WEBM 等格式，最大 20GB</p>
                    <input type="file" id="fileInput" accept="video/*" style="display: none" multiple>
                </div>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <p class="progress-text" id="progressText" style="margin-top: 10px; text-align: center; color: #a0a0a0;"></p>
                </div>

                <div class="video-grid" id="videoGrid">
                    <div class="empty-state" id="emptyState">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5">
                            <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <p style="margin-top: 15px;">暂无视频，上传第一个视频开始吧</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Format Analysis Modal -->
    <div class="modal" id="formatModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">视频格式检测</span>
                <button class="modal-close" onclick="cancelUpload()">&times;</button>
            </div>

            <div class="format-info" id="formatInfo">
                <div class="format-info-row">
                    <span class="format-info-label">文件名</span>
                    <span class="format-info-value" id="infoFilename">-</span>
                </div>
                <div class="format-info-row">
                    <span class="format-info-label">视频编码</span>
                    <span class="format-info-value" id="infoVideoCodec">-</span>
                </div>
                <div class="format-info-row">
                    <span class="format-info-label">音频编码</span>
                    <span class="format-info-value" id="infoAudioCodec">-</span>
                </div>
                <div class="format-info-row">
                    <span class="format-info-label">分辨率</span>
                    <span class="format-info-value" id="infoResolution">-</span>
                </div>
                <div class="format-info-row">
                    <span class="format-info-label">文件大小</span>
                    <span class="format-info-value" id="infoSize">-</span>
                </div>
                <div class="format-info-row">
                    <span class="format-info-label">时长</span>
                    <span class="format-info-value" id="infoDuration">-</span>
                </div>
            </div>

            <div id="formatResult">
                <div class="transcode-options" id="transcodeOptions">
                    <!-- Options will be dynamically inserted here -->
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-secondary" onclick="cancelUpload()">取消</button>
                <button class="btn btn-primary" id="confirmUploadBtn" onclick="confirmUpload()">确认上传</button>
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">重命名视频</span>
                <button class="modal-close" onclick="closeModal('renameModal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">视频名称</label>
                <input type="text" class="form-input" id="renameInput">
            </div>
            <div class="form-group">
                <label class="form-label">文件夹</label>
                <select class="form-select" id="moveFolderSelect">
                    <option value="">无</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeModal('renameModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmRename()">保存</button>
            </div>
        </div>
    </div>

    <!-- Create Folder Modal -->
    <div class="modal" id="createFolderModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">新建文件夹</span>
                <button class="modal-close" onclick="closeModal('createFolderModal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">文件夹名称</label>
                <input type="text" class="form-input" id="newFolderName" placeholder="输入文件夹名称">
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeModal('createFolderModal')">取消</button>
                <button class="btn btn-primary" onclick="createFolder()">创建</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">确认删除</span>
                <button class="modal-close" onclick="closeModal('deleteModal')">&times;</button>
            </div>
            <p style="color: #a0a0a0;">确定要删除这个视频吗？此操作无法撤销。</p>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeModal('deleteModal')">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">复制成功！</div>

    <script>
        let currentFolder = '';
        let currentVideoId = null;
        let allFolders = [];
        let pendingFile = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadVideos();
            setupUpload();
        });

        // Setup upload area
        function setupUpload() {
            const uploadSection = document.getElementById('uploadSection');
            const fileInput = document.getElementById('fileInput');

            uploadSection.addEventListener('click', () => fileInput.click());

            uploadSection.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadSection.classList.add('dragover');
            });

            uploadSection.addEventListener('dragleave', () => {
                uploadSection.classList.remove('dragover');
            });

            uploadSection.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFiles(e.target.files);
                }
            });
        }

        // Handle file upload
        function handleFiles(files) {
            if (files.length > 0) {
                analyzeFile(files[0]);
            }
        }

        // Analyze file
        async function analyzeFile(file) {
            const uploadSection = document.getElementById('uploadSection');
            uploadSection.classList.add('analyzing');
            pendingFile = file;

            const formData = new FormData();
            formData.append('video', file);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                uploadSection.classList.remove('analyzing');

                if (data.error) {
                    showToast(data.error, 'error');
                    return;
                }

                // Show format modal
                showFormatModal(data, file);
            } catch (error) {
                uploadSection.classList.remove('analyzing');
                showToast('分析失败: ' + error.message, 'error');
            }
        }

        // Show format modal
        function showFormatModal(data, file) {
            document.getElementById('infoFilename').textContent = data.filename || file.name;
            document.getElementById('infoVideoCodec').textContent = data.video_codec?.toUpperCase() || 'unknown';
            document.getElementById('infoAudioCodec').textContent = data.audio_codec?.toUpperCase() || 'unknown';
            document.getElementById('infoResolution').textContent = data.width && data.height ? `${data.width}x${data.height}` : '-';
            document.getElementById('infoSize').textContent = formatSize(data.size || file.size);

            const duration = data.duration || 0;
            document.getElementById('infoDuration').textContent = formatDuration(duration);

            // Set codec colors
            const videoCodecEl = document.getElementById('infoVideoCodec');
            const audioCodecEl = document.getElementById('infoAudioCodec');

            if (['h264', 'avc'].includes(data.video_codec?.toLowerCase())) {
                videoCodecEl.className = 'format-info-value success';
            } else {
                videoCodecEl.className = 'format-info-value warning';
            }

            if (['aac', 'mp3', 'opus'].includes(data.audio_codec?.toLowerCase())) {
                audioCodecEl.className = 'format-info-value success';
            } else {
                audioCodecEl.className = 'format-info-value warning';
            }

            // Generate format status
            const optionsContainer = document.getElementById('transcodeOptions');

            if (data.is_compatible) {
                optionsContainer.innerHTML = `
                    <div style="background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3); border-radius: 8px; padding: 10px;">
                        <span style="color: #4caf50;">✅ 视频格式已兼容 VRCHAT，可直接使用，无需转码</span>
                    </div>
                `;
            } else {
                optionsContainer.innerHTML = `
                    <div style="background: rgba(255, 152, 0, 0.1); border: 1px solid rgba(255, 152, 0, 0.3); border-radius: 8px; padding: 10px; margin-bottom: 15px;">
                        <span style="color: #ff9800;">⚠️ ${data.reason || '视频格式不兼容 VRCHAT，需要转码'}</span>
                    </div>
                    <div style="background: rgba(102, 126, 234, 0.1); border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 8px; padding: 10px;">
                        <span style="color: #667eea;">🎬 系统将使用高质量编码（CRF=18）进行转码，保留最佳画质</span>
                    </div>
                `;
            }

            document.getElementById('formatModal').classList.add('show');
        }

        // Confirm upload
        async function confirmUpload() {
            if (!pendingFile) {
                showToast('没有待上传的文件', 'error');
                return;
            }

            const modal = document.getElementById('formatModal');
            modal.classList.remove('show');

            // Get video_id from the analyze response stored in pendingFile
            const formData = new FormData();
            formData.append('video', pendingFile);

            try {
                // First analyze to get video_id (and save analysis to temp file)
                const analyzeResponse = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });
                const analyzeData = await analyzeResponse.json();

                if (analyzeData.error) {
                    showToast(analyzeData.error, 'error');
                    return;
                }

                // Now upload - transcoding decision is made automatically based on format
                const uploadResponse = await fetch('/api/upload', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        video_id: analyzeData.video_id,
                        folder: currentFolder
                    })
                });

                const uploadData = await uploadResponse.json();

                if (uploadData.success) {
                    showToast(uploadData.message, 'success');
                    loadVideos();
                } else {
                    showToast(uploadData.error || '上传失败', 'error');
                }
            } catch (error) {
                showToast('上传失败: ' + error.message, 'error');
            }

            pendingFile = null;
            document.getElementById('fileInput').value = '';
        }

        // Cancel upload
        function cancelUpload() {
            pendingFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('formatModal').classList.remove('show');
        }

        // Load videos
        async function loadVideos() {
            try {
                const url = currentFolder ? `/api/videos?folder=${encodeURIComponent(currentFolder)}` : '/api/videos';
                const response = await fetch(url);
                const data = await response.json();

                allFolders = data.folders || [];
                renderFolders(data.videos);
                renderVideos(data.videos);
            } catch (error) {
                showToast('加载视频失败', 'error');
            }
        }

        // Render folders
        function renderFolders(videos) {
            const folderList = document.getElementById('folderList');
            const totalCount = document.getElementById('totalCount');

            totalCount.textContent = videos.length;

            let html = `
                <li class="folder-item all ${currentFolder === '' ? 'active' : ''}" onclick="filterByFolder('')">
                    <span>全部视频</span>
                    <span class="folder-count">${videos.length}</span>
                </li>
            `;

            for (const folder of allFolders) {
                const count = videos.filter(v => v.folder === folder).length;
                html += `
                    <li class="folder-item ${currentFolder === folder ? 'active' : ''}" onclick="filterByFolder('${folder}')">
                        <span>${folder}</span>
                        <span class="folder-count">${count}</span>
                    </li>
                `;
            }

            folderList.innerHTML = html;
        }

        // Render videos
        function renderVideos(videos) {
            const videoGrid = document.getElementById('videoGrid');
            const emptyState = document.getElementById('emptyState');

            if (videos.length === 0) {
                videoGrid.innerHTML = `
                    <div class="empty-state">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5">
                            <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <p style="margin-top: 15px;">暂无视频</p>
                    </div>
                `;
                return;
            }

            videoGrid.innerHTML = videos.map(video => `
                <div class="video-card ${video.status === 'processing' ? 'processing' : ''}">
                    <div class="video-preview">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5">
                            <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="video-info">
                        <div class="video-name" title="${video.name}">${video.name}</div>
                        <div class="video-meta">
                            <span>${formatSize(video.size)}</span>
                            <span>${formatDuration(video.duration)}</span>
                            <span>${video.resolution}</span>
                        </div>
                        ${video.folder ? `<span class="badge badge-folder">${video.folder}</span>` : ''}
                        ${video.status === 'processing' ? '<span class="badge badge-processing">处理中...</span>' : ''}
                        <div class="video-url-container" style="margin-top: 10px;">
                            <div class="video-url" title="${video.url}">${video.url}</div>
                            <button class="btn btn-sm btn-primary" onclick="copyUrl('${video.url}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                    <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                                </svg>
                            </button>
                        </div>
                        <div class="video-actions" style="margin-top: 10px;">
                            <button class="btn btn-sm btn-secondary" onclick="showRenameModal('${video.id}', '${video.name.replace(/'/g, "\\'")}', '${video.folder || ''}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                                编辑
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="showDeleteModal('${video.id}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3,6 5,6 21,6"/>
                                    <path d="M19,6V20a2,2,0,0,1-2,2H7A2,2,0,0,1,5,20V6M8,6V4A2,2,0,0,1,10,2h4A2,2,0,0,1,16,4V6"/>
                                </svg>
                                删除
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter by folder
        function filterByFolder(folder) {
            currentFolder = folder;
            loadVideos();
        }

        // Show rename modal
        function showRenameModal(videoId, name, folder) {
            currentVideoId = videoId;
            document.getElementById('renameInput').value = name;

            const select = document.getElementById('moveFolderSelect');
            select.innerHTML = '<option value="">无</option>';
            for (const f of allFolders) {
                select.innerHTML += `<option value="${f}" ${f === folder ? 'selected' : ''}>${f}</option>`;
            }

            document.getElementById('renameModal').classList.add('show');
        }

        // Confirm rename
        async function confirmRename() {
            const newName = document.getElementById('renameInput').value.trim();
            const folder = document.getElementById('moveFolderSelect').value;

            if (!newName) {
                showToast('请输入视频名称', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/video/${currentVideoId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: newName, folder: folder})
                });

                if (response.ok) {
                    showToast('修改成功', 'success');
                    closeModal('renameModal');
                    loadVideos();
                }
            } catch (error) {
                showToast('修改失败', 'error');
            }
        }

        // Show delete modal
        function showDeleteModal(videoId) {
            currentVideoId = videoId;
            document.getElementById('deleteModal').classList.add('show');
        }

        // Confirm delete
        async function confirmDelete() {
            try {
                const response = await fetch(`/api/video/${currentVideoId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast('删除成功', 'success');
                    closeModal('deleteModal');
                    loadVideos();
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
        }

        // Show create folder modal
        function showCreateFolderModal() {
            document.getElementById('newFolderName').value = '';
            document.getElementById('createFolderModal').classList.add('show');
        }

        // Create folder
        async function createFolder() {
            const name = document.getElementById('newFolderName').value.trim();

            if (!name) {
                showToast('请输入文件夹名称', 'error');
                return;
            }

            try {
                const response = await fetch('/api/folder', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name})
                });

                if (response.ok) {
                    showToast(`文件夹 "${name}" 已创建`, 'success');
                    closeModal('createFolderModal');
                    loadVideos();
                }
            } catch (error) {
                showToast('创建失败', 'error');
            }
        }

        // Scan folder
        async function scanFolder() {
            try {
                const response = await fetch('/api/scan', {method: 'POST'});
                const data = await response.json();

                if (data.success) {
                    showToast(data.message || `扫描完成，新增 ${data.added} 个视频`, 'success');
                    loadVideos();
                } else {
                    showToast(data.message || data.error || '扫描失败', 'error');
                }
            } catch (error) {
                showToast('扫描失败: 网络错误', 'error');
            }
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        // Copy URL
        function copyUrl(url) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('链接已复制到剪贴板', 'success');
                }).catch((err) => {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        }

        // Fallback copy method
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('链接已复制到剪贴板', 'success');
                } else {
                    showToast('复制失败，请手动复制链接', 'error');
                }
            } catch (err) {
                showToast('复制失败，请手动复制链接', 'error');
            }

            document.body.removeChild(textarea);
        }

        // Show toast
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show';
            if (type) {
                toast.classList.add(type);
            }
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Format helpers
        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDuration(seconds) {
            if (!seconds || seconds === 0) return '00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${m}:${String(s).padStart(2, '0')}`;
        }
    </script>
</body>
</html>

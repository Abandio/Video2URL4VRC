worker_processes auto;
error_log /tmp/nginx_error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /tmp/nginx_access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for video
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types video/mp4 video/webm video/ogg;

    # Client settings
    client_max_body_size 10G;

    # Use temp directory for uploads and nginx temp files
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        server_name _;

        # Root directory for videos
        root /workspace/data/videos;
        autoindex off;

        # CORS headers for VRCHAT compatibility
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Accept-Encoding' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

        # Video file handling
        location / {
            # Video MIME types
            types {
                video/mp4 mp4 m4v;
                video/webm webm;
                video/ogg ogv;
            }
            default_type video/mp4;

            # Enable range requests for video streaming
            max_ranges 1;

            # Caching headers
            expires 1y;
            add_header Pragma public;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}